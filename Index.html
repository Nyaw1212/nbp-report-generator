<!DOCTYPE html>
<html>

    <main class="shell">
      <section class="card">
        <p class="eyebrow">NBP ATTENDANCE CENTER</p>
        <h1>Report Generator</h1>
        <p class="intro">Generate a Page 1 test report from the active office and shift directories.</p>

        <form id="report-form">
          <label for="camp">Camp</label>
