<style>
  :root {
    color-scheme: light;
    font-family: Inter, Arial, sans-serif;
    background: #f4f7f2;
    color: #162018;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at top left, rgba(252, 221, 9, 0.18), transparent 34rem),
      #f4f7f2;
  }

  .shell {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .card {
    width: min(100%, 560px);
    background: #fff;
    border: 1px solid #dfe7dc;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 18px 50px rgba(22, 32, 24, 0.09);
  }

  .eyebrow {
    margin: 0 0 8px;
    color: #526b56;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.12em;
  }

  h1, h2 { margin: 0; }
  h1 { font-size: clamp(28px, 5vw, 40px); }
  h2 { font-size: 20px; }

  .intro {
    margin: 10px 0 24px;
    color: #5d665f;
    line-height: 1.5;
  }

  form { display: grid; gap: 10px; }
  label { margin-top: 6px; font-weight: 750; }

  select, input, button, .button {
    width: 100%;
    min-height: 46px;
    border-radius: 10px;
    font: inherit;
  }

  select, input {
    border: 1px solid #cbd7c9;
    background: #fff;
    padding: 0 12px;
  }

  button, .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    padding: 0 16px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
  }

  button {
    margin-top: 12px;
    background: #1c5d35;
    color: #fff;
  }

  button:disabled { cursor: wait; opacity: 0.55; }
  .secondary { background: #edf4ec; color: #174628; }

  .status {
    min-height: 24px;
    margin-top: 16px;
    color: #526159;
  }

  .status.error { color: #a32323; }

  .result {
    margin-top: 18px;
    border-top: 1px solid #e2e8e0;
    padding-top: 18px;
  }

  .result p { color: #566059; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .warnings { margin: 14px 0 0; padding-left: 20px; color: #7b5b00; }

  @media (max-width: 520px) {
    .card { padding: 22px; }
    .actions { grid-template-columns: 1fr; }
  }
</style>
